# 飞控冗余集群成员变更轨迹复核站点
#
# 常规启动（宿主端口可通过 WEB_PORT 配置，默认 8080）：
#   docker compose up --build
#   WEB_PORT=9090 docker compose up --build
#
# 一次性验收（代码测试 + 页面构建检查 + 业务场景复核 + HTTP 冒烟，退出码报告）：
#   docker compose --profile verify run --rm verify
#
services:
  web:
    build: .
    image: membership-trace-reviewer:latest
    container_name: membership-trace-reviewer-web
    environment:
      # 容器内监听端口；与下方 healthcheck/EXPOSE 保持一致
      PORT: "8080"
      HOST: "0.0.0.0"
    ports:
      # 宿主机可配端口 WEB_PORT -> 容器 8080
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  verify:
    # 名为 verify 的一次性验收服务：对 web 做联合多数/配置阶段等业务场景复核、
    # 代码测试、页面构建检查与 HTTP 冒烟，完成后退出并以退出码报告结果
    profiles: ["verify"]
    image: membership-trace-reviewer:latest
    build: .
    depends_on:
      web:
        condition: service_healthy
    environment:
      BASE_URL: "http://web:8080"
    command: ["node", "verify/verify"]
    restart: "no"
