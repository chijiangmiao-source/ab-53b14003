services:
  web:
    build: .
    image: quorum-review:latest
    ports:
      # 可配置端口：PORT_APP 默认 8080
      - "${PORT_APP:-8080}:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s
    restart: unless-stopped

  # 一次性验收服务：复核联合多数和配置阶段等业务场景，
  # 完成代码测试、页面构建检查及 HTTP 冒烟后退出，并以退出码报告结果。
  verify:
    build: .
    image: quorum-review:latest
    entrypoint: ["node", "verify.js"]
    restart: "no"
    depends_on:
      web:
        condition: service_healthy
